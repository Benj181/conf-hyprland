# ~/.config/hypr/hypridle.conf
# Idle management: dim is skipped (no backlight), then lock, then DPMS off.

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid stacking lock instances
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'  # else screens can stay black
}


# 10 min: lock
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 15 min: screens off
listener {
    timeout = 900
    # dpms needs the table form; a bare string like dpms("on") is a toggle.
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
