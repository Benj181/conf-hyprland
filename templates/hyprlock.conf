# GENERATED from palettes/{{palette}}.env by scripts/theme.sh -- do not edit.
# Edit templates/hyprlock.conf and re-run the script.
#
# The whole file is generated rather than sourcing a colours file. hyprlang
# does have `source =`, but a lock screen is the one config where a parse
# failure locks you out of your own machine, and a second file is a second
# thing that can be missing after a fresh stow. Generating the lot keeps it to
# one self-contained file.
#
# Test this with a spare TTY reachable (Ctrl+Alt+F3) before trusting hypridle
# to trigger it unattended.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = $HOME/hyprland-dotfiles/wallpapers/{{palette}}-landscape.png
    blur_passes = 2
    blur_size = 6
    brightness = 0.7
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba({{text_raw}}ff)
    font_size = 96
    font_family = FiraCode Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba({{dim_raw}}ff)
    font_size = 18
    font_family = FiraCode Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 44
    outline_thickness = 1
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true

    # Square, matching the window borders and the bar. The old 10px radius was
    # the last rounded element left once everything else went flat.
    rounding = 0

    outer_color = rgba({{border_raw}}ff)
    inner_color = rgba({{surface_raw}}ee)
    font_color  = rgba({{text_raw}}ff)

    # check_color is the state while the password is being verified, and it is
    # deliberately the same grey as the rest: a green flash on a monochrome
    # lock screen is the one moment the whole scheme breaks character. Failure
    # keeps its red -- that is information, not decoration.
    check_color = rgba({{dim_raw}}ff)
    fail_color  = rgba({{urgent_raw}}ff)

    placeholder_text = <span foreground="##{{muted_raw}}">Password</span>
    fail_text = <span foreground="##{{urgent_raw}}">$FAIL ($ATTEMPTS)</span>

    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
