# GENERATED from palettes/{{palette}}.env by scripts/theme.sh -- do not edit.
# Edit templates/hyprpaper.conf and re-run the script.
#
# Generated purely so the wallpaper path can follow the palette name. hyprpaper
# has no variables and no include, so there is no way to parameterise one line
# of an otherwise static file.
#
# ~/.config/hypr/hyprpaper.conf
# hyprpaper is launched from autostart.lua. Without this file it starts,
# logs "Monitor <name> has no target: no wp will be created", and paints
# nothing -- which is why there was no wallpaper before.
#
# NOTE: this is hyprpaper >= 0.8 syntax. 0.8 was rewritten on hyprtoolkit and
# replaced the old flat form:
#
#     preload = /path/to.jpg
#     wallpaper = DP-3,/path/to.jpg
#
# with the wallpaper {} blocks below. The old syntax does not error -- it is
# silently ignored and every monitor ends up with no target. Most guides and
# dotfiles online still show the old form.
#
# hyprpaper also does not expand ~ or $HOME here, so paths are absolute.
#
# The image is generated by scripts/make-wallpaper.py from the active palette,
# so the filename tracks the palette name. Switching palettes and forgetting
# this file would leave the old scheme's wallpaper behind the new bar, which
# is the most visible half-retheme there is -- scripts/theme.sh regenerates
# under the same name and tells hyprpaper to re-read it.

splash = false

wallpaper {
    monitor = DP-3
    path = /home/baas/hyprland-dotfiles/wallpapers/{{palette}}-landscape.png
    fit_mode = cover
}

# DP-2 is landscape now (no rotation), so it gets the landscape image too.
wallpaper {
    monitor = DP-2
    path = /home/baas/hyprland-dotfiles/wallpapers/{{palette}}-landscape.png
    fit_mode = cover
}
