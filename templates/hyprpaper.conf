# GENERATED from palettes/{{palette}}.env by scripts/theme.sh -- do not edit.
# Edit templates/hyprpaper.conf and re-run the script.
# Generated so the wallpaper path follows the palette name.
#
# hyprpaper >= 0.8 syntax (wallpaper {} blocks). The old `preload =` /
# `wallpaper = MON,path` form is silently ignored. Paths must be absolute
# (no ~ or $HOME expansion).

splash = false

wallpaper {
    monitor = DP-3
    path = /home/baas/hyprland-dotfiles/wallpapers/{{palette}}-landscape.png
    fit_mode = cover
}

wallpaper {
    monitor = DP-2
    path = /home/baas/hyprland-dotfiles/wallpapers/{{palette}}-landscape.png
    fit_mode = cover
}
