# /etc/greetd/config.toml
# Installed by scripts/install-greeter.sh -- edit greeter/etc/greetd/config.toml
# in the repo, not this copy.
#
# Safe from upgrades because config.toml is in greetd's pacman backup array
# (install-greeter.sh checks): pacman keeps local edits and writes a .pacnew.
# If that ever changes, /etc/greetd/greetd.conf is the fallback.

[terminal]
# Must match the getty greetd.service conflicts with (checked by install-greeter.sh).
vt = 1

[default_session]
# The greeter's compositor config; see /etc/nwg-hello/hyprland.lua.
command = "/usr/bin/start-hyprland -- -c /etc/nwg-hello/hyprland.lua"

# Created by greetd's sysusers file; needs the `video` group (install-greeter.sh).
user = "greeter"
