# GENERATED from palettes/mono-warm.env by scripts/theme.sh -- do not edit.
# Edit templates/hyprlock.conf and re-run the script.
#
# Self-contained (no `source =`) so a missing file can't break the lock screen.
# Test with a spare TTY reachable (Ctrl+Alt+F3) after changes.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = $HOME/hyprland-dotfiles/wallpapers/mono-warm-landscape.png
    blur_passes = 2
    blur_size = 6
    brightness = 0.7
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(ddd6ceff)
    font_size = 96
    font_family = FiraCode Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(8c837aff)
    font_size = 18
    font_family = FiraCode Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 44
    outline_thickness = 1
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true

    rounding = 0

    outer_color = rgba(322f2cff)
    inner_color = rgba(1d1b19ee)
    font_color  = rgba(ddd6ceff)

    # Verifying stays grey; only failure is coloured.
    check_color = rgba(8c837aff)
    fail_color  = rgba(c05a50ff)

    placeholder_text = <span foreground="##5e574f">Password</span>
    fail_text = <span foreground="##c05a50">$FAIL ($ATTEMPTS)</span>

    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
