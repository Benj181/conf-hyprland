# ~/.config/hypr/autostart.conf

exec-once = waybar
exec-once = mako
exec-once = hyprpaper
exec-once = hypridle

# Polkit authentication agent. Started through its systemd user unit rather
# than an absolute path: the previous hardcoded
# /usr/lib/polkit-kde-authentication-agent-1 did not exist on this system and
# failed silently, so auth prompts never appeared. (The real binary ships at
# /usr/libexec/hyprpolkitagent, but let systemd resolve that.)
exec-once = systemctl --user start hyprpolkitagent

# NetworkManager secret agent. Without this, nothing in the Hyprland session
# feeds saved Wi-Fi/eduroam passwords from the keyring to NetworkManager, so it
# re-prompts every login. (On GNOME, gnome-shell fills this role.)
exec-once = nm-applet --indicator

exec-once = wl-paste --watch cliphist store
