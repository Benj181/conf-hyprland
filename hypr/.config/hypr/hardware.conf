# ~/.config/hypr/hardware.conf
# Everything specific to this machine lives here. If a second machine ever
# shows up, this is the only file that needs to differ.
#
# ADAPTED FOR THIS LAPTOP (Ubuntu 26.04). The original targeted "europa": an
# NVIDIA (RTX 5070 Ti) desktop with 2x 2560x1440 monitors, one rotated portrait.
# This machine is a laptop with a single internal panel (eDP-1) and no NVIDIA,
# so the NVIDIA env block and the dual-monitor/transform lines are gone.

# No NVIDIA env vars here. On europa these selected the nvidia GBM backend:
#     env = LIBVA_DRIVER_NAME,nvidia
#     env = GBM_BACKEND,nvidia-drm
#     env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# On a non-NVIDIA GPU those are wrong and can leave you with a black session,
# so they are deliberately omitted. Add an Intel/AMD equivalent only if needed.

cursor {
    no_hardware_cursors = false
}

# Single internal panel. `preferred,auto,1` lets Hyprland pick the native mode
# and refresh and place it at 0x0 -- no hard-coded resolution to go stale if
# this ever runs on different hardware. Detected connected output: eDP-1.
# Check/refine with `hyprctl monitors` once you're in the session.
# scale 2 = 200% (integer, pixel-perfect) for this HiDPI panel. For a
# non-integer factor Hyprland needs a scale that divides the pixel width
# cleanly, e.g. 1.5 -> `hyprctl monitors` will warn if a scale is rejected.
monitor = eDP-1, preferred, auto, 2
# Fallback for any other/external output, so a plugged-in monitor just works:
monitor = , preferred, auto, 1

# Single monitor: no per-monitor workspace pinning (europa split 1/2 across its
# two panels). Workspaces fall back to Hyprland's defaults.

# PATH for the session. A GDM-launched Hyprland session never sources ~/.profile,
# so the per-user bin dirs this Ubuntu setup relies on are missing from PATH:
#   ~/.local/bin     -> hyprshot, and any future user script
#   ~/.cargo/bin     -> rustup/cargo shims
#   ~/.npm-global/bin-> claude (npm user prefix)
# Setting PATH here makes bare command names work for everything Hyprland spawns
# (keybinds, exec-once). Explicit values because Hyprland does not expand $PATH.
# Applies to children started after Hyprland (re)starts. Also mirrored in
# ~/.config/environment.d/10-user-paths.conf for non-Hyprland launches.
env = PATH,/home/baas/.local/bin:/home/baas/.cargo/bin:/home/baas/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin

# GTK4 renderer. GTK 4.14+ defaults to the Vulkan GSK renderer; on this laptop's
# Adreno GPU (msm/kgsl + Mesa Turnip, still maturing) that renderer corrupts its
# glyph atlas, showing garbled multi-colour letters intermittently. `ngl` is the
# GL renderer -- keeps GPU acceleration but avoids the Vulkan glyph bug. If text
# artifacts persist, `cairo` (software) is the guaranteed fallback.
env = GSK_RENDERER,ngl
