# --- ANSI 0-15 --------------------------------------------------------------
# colour0/7/8/15 come off the greyscale ramp; the six hues are the palette's
# desaturated set. Making these achromatic too would be more "correct" for a
# monochrome rice and would break `git diff`, `ls`, `grep --color` and every
# compiler's error output at once -- red and green have to stay
# distinguishable, so they are kept at the lowest saturation that survives it.
color0  #1d1b19
color8  #5e574f

color1  #b06a66
color9  #c48480

color2  #8a9b76
