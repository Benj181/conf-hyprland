# ~/.config/kitty/kitty.conf

# Generated by scripts/theme.sh from the active palette. Do not put colour
# directives anywhere else in this file -- kitty applies the last value it
# sees, so a stray one below would silently win over the palette.
include colors.conf

# fonts
font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

allow_remote_control yes
listen_on unix:@kitty

# window
# 6px, down from 12. Hyprland's gaps already sit outside this, so the old
# value stacked 12px of kitty padding on top of 8px of compositor gap and put
# 20px between the text and the next window.
window_padding_width 6
confirm_os_window_close 0

# visual
background_opacity 1

# tab bar
tab_bar_edge top
# `powerline` draws slanted separators with their own fill colour -- the one
# decorative flourish kitty ships by default, and the terminal equivalent of
# the bar's old pill sections. `separator` is a plain glyph between tabs.
tab_bar_style separator
tab_separator " │ "
tab_bar_min_tabs 2
hide_window_decorations yes
